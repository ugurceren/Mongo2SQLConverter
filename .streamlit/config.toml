[theme]
# Fallback only: the light and dark variants below decide, and the top-bar
# switch picks one of them.
base = "dark"
showWidgetBorder = true
headingFontSizes = ["1.75rem", "1.25rem", "1.125rem"]
headingFontWeights = [700, 600, 600]
metricValueFontSize = "1.5rem"
metricValueFontWeight = 600

[theme.dark]
# White button text needs 4.5:1, so the primary is darker than the link blue.
primaryColor = "#2563eb"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"
borderColor = "#3d444d"
linkColor = "#4c8dff"
greenColor = "#3fb950"
yellowColor = "#d29922"
redColor = "#f85149"

[theme.light]
# Dimmed: no pure white surfaces. Accents are a step darker than GitHub's so
# text keeps 4.5:1 on the grey background (5:1 or more on #e9ecef).
primaryColor = "#0a5cc2"
backgroundColor = "#e9ecef"
secondaryBackgroundColor = "#f2f4f6"
textColor = "#1f2328"
borderColor = "#c3cad2"
linkColor = "#0a5cc2"
greenColor = "#176f30"
yellowColor = "#805600"
redColor = "#b81d29"

[theme.dark.sidebar]
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"

[theme.light.sidebar]
backgroundColor = "#eef0f2"
secondaryBackgroundColor = "#e4e7ea"

[client]
toolbarMode = "minimal"
