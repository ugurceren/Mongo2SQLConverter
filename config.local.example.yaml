mongodb:
  uri: "mongodb://host:27017/?authSource=admin"
  database: "mydb"
  username: "user"
  password: "secret"

mssql:
  server: "srv\\INSTANCE"
  database: "MyWarehouse"
  schema: "dbo"
  driver: "ODBC Driver 17 for SQL Server"
  # windows      -> uygulamayi calistiran Windows hesabi
  # sql          -> SQL Server login'i (username + password)
  # windows_user -> girilen domain hesabi taklit edilir (pywin32 gerekir)
  auth: "windows"
  username: ""           # windows disindaki modlarda dolu olur
  password: ""           # bos ise arayuzde "sakla" kapali demektir
  encrypt: "default"     # default | yes | no
  trust_certificate: false

# SQL aktarimi sayfasindaki secimler koleksiyon basina buraya yazilir.
# Arayuzden doldurulur; elle yazmak zorunlu degildir.
transfer:
  conversations:
    date_filter:
      enabled: true
      field: "createdAt"     # tarih tipli bir alan
      start: "2024-01-01"    # dahil
      end: "2024-12-31"      # dahil
      timezone: "local"      # local | utc
    columns:
      exclude:               # aktarilmayacak Mongo alan yollari
        - "meta.raw"
      exclude_tables:        # aktarilmayacak alt tablolarin kaynak yollari
        - "tracker.slots"
    nesting: hybrid          # deep | hybrid | columns
    table: Conversations     # kok tablo; bos ise koleksiyon adindan uretilir
    schema: dbo
    schedule_mode: auto      # auto | full | incremental
    batch: 500
    sample: 5000             # profil ornegi; 0 = tam tarama
    allow_null: true
